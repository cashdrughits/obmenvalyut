<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Обмен Валют Админ</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #090d15;
    background-image:
      radial-gradient(ellipse 70% 45% at 15% -10%, rgba(61,174,159,0.14), transparent),
      radial-gradient(ellipse 60% 40% at 100% 10%, rgba(221,170,75,0.06), transparent);
    font-family: 'Inter', system-ui, sans-serif;
    color: #ecf0f4;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 380px; padding: 40px 36px;
    background: #10151e;
    border: 1px solid #222835;
    border-radius: 16px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  .logo { font-size: 22px; font-weight: 700; color: #4c7dff; margin-bottom: 6px; letter-spacing: -.02em; }
  .sub  { font-size: 13px; color: #929caa; margin-bottom: 32px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #929caa; margin-bottom: 6px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 12px 14px;
    background: #1b212c; border: 1px solid #222835; border-radius: 8px;
    color: #ecf0f4; font-size: 15px; font-family: inherit;
    margin-bottom: 18px; outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: #4c7dff; }
  .btn {
    width: 100%; padding: 13px;
    background: #4c7dff; color: #06120f;
    border: none; border-radius: 999px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: background .2s;
  }
  .btn:hover { background: #6390ff; }
  .error {
    background: rgba(220,60,60,.12);
    border: 1px solid rgba(220,60,60,.35);
    border-radius: 8px; padding: 11px 14px;
    font-size: 13.5px; color: #f87171;
    margin-bottom: 20px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Обмен Валют</div>
  <div class="sub">Панель управления курсами</div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/admin/login">
    <label for="username">Логин</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus required>

    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>

    <button class="btn" type="submit">Войти</button>
  </form>
</div>
</body>
</html>
