name: Update exchange rates from Telegram

on:
  schedule:
    # каждые 10 минут (UTC). Можно сделать реже, например */15 или */30,
    # чтобы бережнее расходовать лимиты Actions.
    - cron: "*/59 * * * *"
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой в GitHub

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Parse rates from Telegram channel
        env:
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
        run: python scripts/parse_rates.py

      - name: Commit and push if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add assets/rates.json
          git diff --cached --quiet || git commit -m "chore: update rates $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
