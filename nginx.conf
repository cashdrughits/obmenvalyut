server {
    listen 80;
    server_name obmen-vernadka.ru www.obmen-vernadka.ru;

    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

HTTPS (раскомментируйте после certbot)
server {
     listen 443 ssl http2;
     server_name obmen-vernadka.ru www.obmen-vernadka.ru;
     ssl_certificate     /etc/letsencrypt/live/obmen-vernadka.ru/fullchain.pem;
     ssl_certificate_key /etc/letsencrypt/live/obmen-vernadka.ru/privkey.pem;
     include /etc/letsencrypt/options-ssl-nginx.conf;

     location / {
         proxy_pass http://127.0.0.1:5001;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
     }
 }
